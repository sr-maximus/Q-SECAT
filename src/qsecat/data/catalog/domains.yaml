metadata:
  framework: Q-SECAT
  framework_version: 0.1.0
  status: community-draft
  release_date: '2026-08-01'
  author: Edwin Javier Peñuela Camacho
  license: Apache-2.0
items:
- id: QSD-01
  name: Cryptographic Transition & Agility
  scope: Inventory, prioritization, migration, interoperability, rollback and lifecycle of classical and post-quantum
    cryptography.
  assets:
  - applications
  - protocols
  - PKI
  - certificates
  - HSMs
  - firmware
  - code signing
  - data archives
  references:
  - SRC-NIST-FIPS203
  - SRC-NIST-FIPS204
  - SRC-NIST-FIPS205
  - SRC-NIST-AGILITY
  - SRC-NIST-MIGRATION
  - SRC-CYCLONEDX-CBOM
- id: QSD-02
  name: Quantum Cryptography & QKD
  scope: Security assumptions, modules, classical authentication, key management, trusted nodes and operational
    resilience of QKD.
  assets:
  - QKD modules
  - quantum channel
  - authenticated classical channel
  - KMS
  - trusted nodes
  - key consumers
  references:
  - SRC-ISO-QKD1
  - SRC-ISO-QKD2
  - SRC-ETSI-QKD016
  - SRC-NSA-QKD
- id: QSD-03
  name: Quantum Networks & Internet
  scope: Quantum links, entanglement services, memories, repeaters, transducers, control, routing, timing and orchestration.
  assets:
  - quantum links
  - repeaters
  - memories
  - transducers
  - orchestrators
  - controllers
  - time sources
  references:
  - SRC-ITU-Y3800
  - SRC-ITU-X1710
  - SRC-ITU-X1711
  - SRC-ITU-Y3832
  - SRC-DOE-QIS
