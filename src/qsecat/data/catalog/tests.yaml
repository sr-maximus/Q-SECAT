items:
- id: QSTEST-01.001
  title: Cryptographic exposure and timeline review
  domain: QSD-01
  technique: QTE-01.001
  control: QSC-01.001
  test_class: T2-static
  purpose: 'Verify the control outcome for: Long-lived data protected by quantum-vulnerable public-key cryptography.'
  prerequisites:
  - Documented authorization and scope
  - Named test owner and reviewer
  - Evidence handling and stop conditions
  procedure:
  - Scan representative code, configurations, certificates and protocol endpoints
  - Reconcile findings with CBOM and asset inventory
  - Calculate X+Y-Z scenarios for material assets
  acceptance_criteria:
  - At least 95% of in-scope critical assets have verified cryptographic records
  - All material positive timeline gaps have assigned treatment owners
  expected_evidence:
  - CBOM or equivalent inventory
  - data-retention classification
  - migration roadmap
  result_values:
  - pass
  - fail
  - partial
  - inconclusive
  - not_run
  destructive: false
  production_safe_by_default: false
  safety: Use only owned or expressly authorized systems and synthetic/non-sensitive workloads. Do not affect other
    tenants or production availability.
  minimum_qal: QAL-2
  references:
  - SRC-NIST-MIGRATION
  - SRC-MOSCA
  - SRC-CYCLONEDX-CBOM
- id: QSTEST-01.002
  title: Inventory completeness reconciliation
  domain: QSD-01
  technique: QTE-01.002
  control: QSC-01.002
  test_class: T2-static
  purpose: 'Verify the control outcome for: Cryptographic inventory and dependency blind spots.'
  prerequisites:
  - Documented authorization and scope
  - Named test owner and reviewer
  - Evidence handling and stop conditions
  procedure:
  - Select a stratified sample of applications, devices and network services
  - Compare independent discovery results with declared inventory
  - Investigate unmatched and stale records
  acceptance_criteria:
  - Critical-scope unmatched rate is below approved threshold
  - Every exception has owner, rationale and expiry
  expected_evidence:
  - signed inventory export
  - discovery logs
  - coverage reconciliation report
  result_values:
  - pass
  - fail
  - partial
  - inconclusive
  - not_run
  destructive: false
  production_safe_by_default: false
  safety: Use only owned or expressly authorized systems and synthetic/non-sensitive workloads. Do not affect other
    tenants or production availability.
  minimum_qal: QAL-2
  references:
  - SRC-NIST-MIGRATION
  - SRC-CYCLONEDX-CBOM
  - SRC-QRAMM
- id: QSTEST-01.003
  title: PQC interoperability and resource benchmark
  domain: QSD-01
  technique: QTE-01.003
  control: QSC-01.003
  test_class: T4-isolated-integration
  purpose: 'Verify the control outcome for: PQC migration interoperability or performance failure.'
  prerequisites:
  - Documented authorization and scope
  - Named test owner and reviewer
  - Evidence handling and stop conditions
  procedure:
  - Create representative client/server/device matrix
  - Exercise approved PQC or hybrid profiles under normal and constrained conditions
  - Record success, size, latency, CPU/memory and fallback behavior
  acceptance_criteria:
  - All required peers interoperate within approved service objectives
  - No silent downgrade to prohibited mechanisms occurs
  expected_evidence:
  - compatibility matrix
  - performance baseline
  - failure and rollback test record
  result_values:
  - pass
  - fail
  - partial
  - inconclusive
  - not_run
  destructive: false
  production_safe_by_default: false
  safety: Use only owned or expressly authorized systems and synthetic/non-sensitive workloads. Do not affect other
    tenants or production availability.
  minimum_qal: QAL-3
  references:
  - SRC-NIST-FIPS203
  - SRC-NIST-FIPS204
  - SRC-NIST-FIPS205
  - SRC-OQS
- id: QSTEST-01.004
  title: Downgrade and rollback policy validation
  domain: QSD-01
  technique: QTE-01.004
  control: QSC-01.004
  test_class: T4-isolated-integration
  purpose: 'Verify the control outcome for: Crypto-agility downgrade, rollback or policy bypass.'
  prerequisites:
  - Documented authorization and scope
  - Named test owner and reviewer
  - Evidence handling and stop conditions
  procedure:
  - Enumerate supported algorithm combinations and policy states
  - Attempt only authorized negative negotiation cases in a test environment
  - Exercise rollback with approvals, logging and recovery
  acceptance_criteria:
  - Prohibited profiles are consistently rejected
  - Rollback is authorized, observable, reversible and time-bounded
  expected_evidence:
  - policy-as-code
  - change approvals
  - negotiation telemetry
  - rollback exercise
  result_values:
  - pass
  - fail
  - partial
  - inconclusive
  - not_run
  destructive: false
  production_safe_by_default: false
  safety: Use only owned or expressly authorized systems and synthetic/non-sensitive workloads. Do not affect other
    tenants or production availability.
  minimum_qal: QAL-3
  references:
  - SRC-NIST-AGILITY
  - SRC-NIST-MIGRATION
- id: QSTEST-02.001
  title: QKD classical-channel authentication review
  domain: QSD-02
  technique: QTE-02.001
  control: QSC-02.001
  test_class: T4-isolated-integration
  purpose: 'Verify the control outcome for: Unauthenticated classical channel or weak key confirmation in QKD.'
  prerequisites:
  - Documented authorization and scope
  - Named test owner and reviewer
  - Evidence handling and stop conditions
  procedure:
  - Trace every classical message flow and trust dependency
  - Verify authentication and key confirmation behavior with a test pair or simulator
  - Check rejection and audit behavior for invalid identities/messages
  acceptance_criteria:
  - All security-relevant classical exchanges are authenticated
  - Invalid peer or key bindings are rejected and logged
  expected_evidence:
  - protocol design
  - authentication configuration
  - key metadata and logs
  result_values:
  - pass
  - fail
  - partial
  - inconclusive
  - not_run
  destructive: false
  production_safe_by_default: false
  safety: Use only owned or expressly authorized systems and synthetic/non-sensitive workloads. Do not affect other
    tenants or production availability.
  minimum_qal: QAL-3
  references:
  - SRC-ISO-QKD1
  - SRC-ISO-QKD2
  - SRC-ETSI-QKD016
  - SRC-ITU-X1711
- id: QSTEST-02.002
  title: QKD assumption-to-implementation trace
  domain: QSD-02
  technique: QTE-02.002
  control: QSC-02.002
  test_class: T5-controlled-physical
  purpose: 'Verify the control outcome for: QKD source, detector or implementation side-channel deviation.'
  prerequisites:
  - Documented authorization and scope
  - Named test owner and reviewer
  - Evidence handling and stop conditions
  procedure:
  - Map proof and protection-profile assumptions to measurable module properties
  - Review certified/evaluated evidence or execute approved laboratory characterization
  - Compare observed parameters with acceptance envelopes
  acceptance_criteria:
  - Every material assumption has current supporting evidence
  - Out-of-envelope behavior triggers safe state or investigation
  expected_evidence:
  - device characterization
  - evaluation report
  - operating-envelope telemetry
  result_values:
  - pass
  - fail
  - partial
  - inconclusive
  - not_run
  destructive: false
  production_safe_by_default: false
  safety: Only execute in an authorized specialist laboratory under a written procedure, qualified supervision,
    defined operating limits and stop conditions. Prefer reviewed existing evidence or synthetic data when sufficient.
  minimum_qal: QAL-4
  references:
  - SRC-ISO-QKD1
  - SRC-ISO-QKD2
  - SRC-ETSI-QKD016
- id: QSTEST-02.003
  title: QKD key lifecycle and trusted-node assessment
  domain: QSD-02
  technique: QTE-02.003
  control: QSC-02.003
  test_class: T4-isolated-integration
  purpose: 'Verify the control outcome for: Trusted-node, KMS or key-relay compromise.'
  prerequisites:
  - Documented authorization and scope
  - Named test owner and reviewer
  - Evidence handling and stop conditions
  procedure:
  - Trace a test key from generation to authorized consumer and destruction
  - Verify access, uniqueness, state transitions and error handling
  - Review trusted-node compromise assumptions and compensating controls
  acceptance_criteria:
  - No unauthorized role can retrieve or redirect key material
  - Key IDs, state and consumer binding remain consistent end to end
  expected_evidence:
  - data-flow diagram
  - KMS access controls
  - key lifecycle audit trail
  result_values:
  - pass
  - fail
  - partial
  - inconclusive
  - not_run
  destructive: false
  production_safe_by_default: false
  safety: Use only owned or expressly authorized systems and synthetic/non-sensitive workloads. Do not affect other
    tenants or production availability.
  minimum_qal: QAL-3
  references:
  - SRC-ETSI-QKD014
  - SRC-ITU-X1710
  - SRC-ITU-Y3832
  - SRC-NSA-QKD
- id: QSTEST-02.004
  title: QKD degradation and fallback exercise
  domain: QSD-02
  technique: QTE-02.004
  control: QSC-02.004
  test_class: T4-isolated-integration
  purpose: 'Verify the control outcome for: QKD availability degradation or secret-key-rate exhaustion.'
  prerequisites:
  - Documented authorization and scope
  - Named test owner and reviewer
  - Evidence handling and stop conditions
  procedure:
  - Use simulator or approved test channel to vary service availability within safe limits
  - Measure key supply, buffering, alarms and consumer behavior
  - Verify recovery and post-event reconciliation
  acceptance_criteria:
  - Degradation is detected before unsafe key exhaustion
  - Consumer behavior follows approved fallback/fail-closed policy
  expected_evidence:
  - capacity model
  - monitoring dashboard
  - degradation exercise
  result_values:
  - pass
  - fail
  - partial
  - inconclusive
  - not_run
  destructive: false
  production_safe_by_default: false
