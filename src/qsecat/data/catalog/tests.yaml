- id: QSTEST-04.002
  title: QRNG health and failure-mode validation
  domain: QSD-04
  technique: QTE-04.002
  control: QSC-04.002
  test_class: T4-isolated-integration
  purpose: 'Verify the control outcome for: QRNG health-test, conditioning or digitization failure.'
  prerequisites:
  - Documented authorization and scope
  - Named test owner and reviewer
  - Evidence handling and stop conditions
  procedure:
  - Use vendor-approved test mode or synthetic input to exercise documented failure conditions
  - Verify alarm, output gating and recovery
  - Compare post-conditioning statistics with documented expectations without treating statistics alone as proof
    of entropy
  acceptance_criteria:
  - Documented failures are detected within approved bounds
  - Untrusted output is blocked or clearly downgraded
  expected_evidence:
  - health-test design
  - test vectors/results
  - alarm and recovery logs
  result_values:
  - pass
  - fail
  - partial
  - inconclusive
  - not_run
