items:
- id: QST-01
  title: Quantum-vulnerable cryptography protecting long-lived data
  description: Confidentiality or trust remains dependent on RSA, finite-field DH, ECC or other quantum-vulnerable
    public-key mechanisms beyond the safe migration window.
  domains:
  - QSD-01
  priority_outcomes:
  - Identify data shelf life
  - Prioritize store-now-decrypt-later exposure
  - Migrate with verified interoperability
  techniques:
  - QTE-01.001
  - QTE-01.003
  controls:
  - QSC-01.001
  - QSC-01.003
- id: QST-02
  title: Incomplete cryptographic inventory and insufficient crypto agility
  description: Unknown cryptographic dependencies, hard-coded algorithms or unsafe negotiation prevent timely and
    controlled migration.
  domains:
