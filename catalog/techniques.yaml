items:
- id: QTE-01.001
  title: Long-lived data protected by quantum-vulnerable public-key cryptography
  domain: QSD-01
  tactics:
  - QTA-09
  description: Sensitive data, trust anchors or signatures remain dependent on public-key mechanisms whose security
    would be materially reduced by a relevant quantum capability.
  preconditions:
  - Quantum-vulnerable mechanism is in use
  - Confidentiality or authenticity must outlive migration window
  potential_impacts:
  - confidentiality
  - integrity
  - privacy_ip
  - regulatory_sovereignty
  evidence_status: established-classical
  observables:
  - RSA/ECC/DH identifiers
  - long certificate or data retention
  - no migration owner
  top10:
  - QST-01
  mitigated_by:
  - QSC-01.001
  tested_by:
  - QSTEST-01.001
  references:
  - SRC-NIST-MIGRATION
  - SRC-MOSCA
  - SRC-CYCLONEDX-CBOM
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-01.002
  title: Cryptographic inventory and dependency blind spots
  domain: QSD-01
  tactics:
  - QTA-01
  - QTA-11
  description: Algorithms, keys, certificates, libraries, hardware or protocol dependencies are absent, stale or
    disconnected from business assets.
  preconditions:
  - Distributed or third-party cryptographic use
  - Inventory relies on manual assertions only
  potential_impacts:
  - confidentiality
  - integrity
  - availability
  - regulatory_sovereignty
  evidence_status: established-classical
  observables:
  - unowned certificates
  - unknown library versions
  - inventory drift
  - undocumented embedded crypto
  top10:
  - QST-02
  mitigated_by:
  - QSC-01.002
  tested_by:
  - QSTEST-01.002
  references:
  - SRC-NIST-MIGRATION
  - SRC-CYCLONEDX-CBOM
  - SRC-QRAMM
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-01.003
  title: PQC migration interoperability or performance failure
  domain: QSD-01
  tactics:
  - QTA-12
  description: A post-quantum or hybrid change causes protocol incompatibility, excessive resource consumption,
    unsafe fallback or operational disruption.
  preconditions:
  - PQC/hybrid implementation introduced
  - Peers, devices or protocols have heterogeneous support
  potential_impacts:
  - availability
  - integrity
  - safety_mission
  evidence_status: documented-implementation-class
  observables:
  - handshake failures
  - message-size errors
  - latency regression
  - fallback to legacy algorithm
  top10:
  - QST-01
  - QST-02
  mitigated_by:
  - QSC-01.003
  tested_by:
  - QSTEST-01.003
  references:
  - SRC-NIST-FIPS203
  - SRC-NIST-FIPS204
  - SRC-NIST-FIPS205
  - SRC-OQS
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-01.004
  title: Crypto-agility downgrade, rollback or policy bypass
  domain: QSD-01
  tactics:
  - QTA-04
  - QTA-09
  - QTA-11
  description: Algorithm selection, negotiation, configuration or rollback allows unauthorized reversion, weak combinations
    or inconsistent policy enforcement.
  preconditions:
  - Multiple algorithms/profiles supported
  - Configuration or negotiation is remotely or administratively mutable
  potential_impacts:
  - confidentiality
  - integrity
  - availability
  evidence_status: established-classical
  observables:
  - policy drift
  - weak negotiated profile
  - unsigned crypto policy
  - uncontrolled rollback
  top10:
  - QST-02
  - QST-03
  mitigated_by:
  - QSC-01.004
  tested_by:
  - QSTEST-01.004
  references:
  - SRC-NIST-AGILITY
  - SRC-NIST-MIGRATION
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-02.001
  title: Unauthenticated classical channel or weak key confirmation in QKD
  domain: QSD-02
  tactics:
  - QTA-09
  - QTA-10
  description: QKD endpoints do not adequately authenticate classical protocol messages, peer identity or final
    key association, enabling man-in-the-middle or key-binding failures.
  preconditions:
  - QKD protocol depends on classical communication
  - Authentication or key confirmation is absent, weak or misconfigured
  potential_impacts:
  - confidentiality
  - integrity
  evidence_status: documented-implementation-class
  observables:
  - missing authentication evidence
  - shared credentials without rotation
  - ambiguous peer/key identifiers
  top10:
  - QST-07
  mitigated_by:
  - QSC-02.001
  tested_by:
  - QSTEST-02.001
  references:
  - SRC-ISO-QKD1
  - SRC-ISO-QKD2
  - SRC-ETSI-QKD016
  - SRC-ITU-X1711
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-02.002
  title: QKD source, detector or implementation side-channel deviation
  domain: QSD-02
  tactics:
  - QTA-08
  - QTA-10
  description: Real devices diverge from security-model assumptions through optical, electronic, timing or processing
    behavior that leaks information or changes detection statistics.
  preconditions:
  - Physical QKD modules deployed
  - Security proof relies on bounded implementation characteristics
  potential_impacts:
  - confidentiality
  - integrity
  evidence_status: documented-implementation-class
  observables:
  - uncharacterized component behavior
  - unexpected detection statistics
  - missing tamper or side-channel evaluation
  top10:
  - QST-07
  mitigated_by:
  - QSC-02.002
  tested_by:
  - QSTEST-02.002
  references:
  - SRC-ISO-QKD1
  - SRC-ISO-QKD2
  - SRC-ETSI-QKD016
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-02.003
  title: Trusted-node, KMS or key-relay compromise
  domain: QSD-02
  tactics:
  - QTA-04
  - QTA-09
  - QTA-10
  description: A trusted relay, key management service, operator or delivery interface exposes, misroutes, reuses
    or substitutes QKD-derived keys.
  preconditions:
  - Network uses trusted nodes or centralized KMS
  - Key material crosses classical storage or management components
  potential_impacts:
  - confidentiality
  - integrity
  - availability
  evidence_status: established-classical
  observables:
  - plaintext key exposure paths
  - overprivileged operators
  - weak key identifiers
  - unprotected KMS API
  top10:
  - QST-03
  - QST-07
  mitigated_by:
  - QSC-02.003
  tested_by:
  - QSTEST-02.003
  references:
  - SRC-ETSI-QKD014
  - SRC-ITU-X1710
  - SRC-ITU-Y3832
  - SRC-NSA-QKD
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-02.004
  title: QKD availability degradation or secret-key-rate exhaustion
  domain: QSD-02
  tactics:
  - QTA-10
  - QTA-12
  description: Channel conditions, control failures, resource pressure or adversarial interference reduce key rate
    below application demand or cause unstable service.
  preconditions:
  - Application availability depends on QKD key supply
  - Capacity/fallback policy is insufficient
  potential_impacts:
  - availability
  - safety_mission
  evidence_status: documented-implementation-class
  observables:
  - falling secret key rate
  - queue growth
  - repeated resynchronization
  - uncontrolled application fallback
  top10:
  - QST-07
  - QST-09
  mitigated_by:
  - QSC-02.004
  tested_by:
  - QSTEST-02.004
  references:
  - SRC-ETSI-QKD016
  - SRC-ITU-X1710
  - SRC-NSA-QKD
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-03.001
  title: Quantum-network control, routing or orchestration compromise
  domain: QSD-03
  tactics:
  - QTA-04
  - QTA-10
  description: Classical controllers or orchestrators alter path selection, resource allocation, policy or service
    state for quantum links.
  preconditions:
  - Software-defined or orchestrated quantum network
  - Controller has broad authority
  potential_impacts:
  - integrity
  - availability
  - confidentiality
  evidence_status: established-classical
  observables:
  - unauthorized topology changes
  - policy mismatch
  - unattributed controller actions
  top10:
  - QST-03
  - QST-09
  mitigated_by:
  - QSC-03.001
  tested_by:
  - QSTEST-03.001
  references:
  - SRC-ITU-X1710
  - SRC-ITU-Y3832
  - SRC-ARGONNE-TAXONOMY
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-03.002
  title: Entanglement, repeater or quantum-memory resource manipulation
  domain: QSD-03
  tactics:
  - QTA-07
  - QTA-10
  - QTA-12
  description: Allocation, quality, state lifetime or service metadata for entanglement/repeater/memory resources
    is corrupted, withheld or misrepresented.
  preconditions:
  - Network exposes shared quantum resources
  - Quality and provenance are used for routing or decisions
  potential_impacts:
  - integrity
  - availability
  evidence_status: plausible-research
  observables:
  - quality/provenance mismatch
  - unexpected resource starvation
  - inconsistent service metadata
  top10:
  - QST-09
  mitigated_by:
  - QSC-03.002
  tested_by:
  - QSTEST-03.002
  references:
  - SRC-DOE-QIS
  - SRC-ARGONNE-TAXONOMY
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-03.003
  title: Quantum/classical synchronization and timing manipulation
  domain: QSD-03
  tactics:
  - QTA-05
  - QTA-10
  - QTA-12
  description: Compromised time, synchronization or event ordering causes invalid protocol association, degraded
    fidelity or incorrect measurement correlation.
  preconditions:
  - Protocol depends on tight timing or synchronized classical metadata
  - Reference source or distribution path can fail or be spoofed
  potential_impacts:
  - integrity
  - availability
  - safety_mission
  evidence_status: documented-implementation-class
  observables:
  - clock offset anomalies
  - event-window mismatch
  - resynchronization bursts
  top10:
  - QST-06
  - QST-09
  mitigated_by:
  - QSC-03.003
  tested_by:
  - QSTEST-03.003
  references:
  - SRC-ITU-Y3800
  - SRC-ITU-X1710
  - SRC-ARGONNE-TAXONOMY
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-03.004
  title: Transduction or quantum/classical boundary failure
  domain: QSD-03
  tactics:
  - QTA-08
  - QTA-10
  - QTA-12
  description: Interfaces converting between media, frequencies or quantum/classical representations leak, corrupt,
    mislabel or lose state and metadata.
  preconditions:
  - System uses transducers or heterogeneous quantum links
  - Boundary assumptions are not independently checked
  potential_impacts:
  - confidentiality
  - integrity
  - availability
  evidence_status: plausible-research
  observables:
  - conversion loss anomaly
  - metadata mismatch
  - unexplained quality degradation
  top10:
  - QST-09
  - QST-10
  mitigated_by:
  - QSC-03.004
  tested_by:
  - QSTEST-03.004
  references:
  - SRC-DOE-QIS
  - SRC-ARGONNE-TAXONOMY
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-04.001
  title: Opaque or unsupported quantum entropy-source claims
  domain: QSD-04
  tactics:
  - QTA-11
  - QTA-09
  description: A QRNG is described as quantum or true-random without sufficient source model, min-entropy estimate,
    operating assumptions or independent evidence.
  preconditions:
  - Security relies on QRNG output
  - Source characterization is absent or proprietary without assurance evidence
  potential_impacts:
  - confidentiality
  - integrity
  - privacy_ip
  evidence_status: documented-implementation-class
  observables:
  - marketing-only claim
  - no raw-source model
  - no entropy estimate or validation scope
  top10:
  - QST-08
  - QST-10
  mitigated_by:
  - QSC-04.001
  tested_by:
  - QSTEST-04.001
  references:
  - SRC-ETSI-QRNG
  - SRC-NIST-ENTROPY
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-04.002
  title: QRNG health-test, conditioning or digitization failure
  domain: QSD-04
  tactics:
  - QTA-05
  - QTA-09
  - QTA-12
  description: Source degradation, digitizer bias, conditioning fault or ineffective online health testing reduces
    entropy without timely detection.
  preconditions:
  - Physical entropy source is variable
  - Monitoring or failure behavior is incomplete
  potential_impacts:
  - confidentiality
  - integrity
  - availability
  evidence_status: documented-implementation-class
  observables:
  - health-test alerts suppressed
  - distribution shift
  - repeated values
  - environmental correlation
  top10:
  - QST-08
  mitigated_by:
  - QSC-04.002
  tested_by:
  - QSTEST-04.002
  references:
  - SRC-ETSI-QRNG
  - SRC-NIST-ENTROPY
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-04.003
  title: Entropy-path API substitution, injection or provenance loss
  domain: QSD-04
  tactics:
  - QTA-04
  - QTA-09
  - QTA-11
  description: Software, driver, API or service routing silently replaces the intended entropy source, mixes unapproved
    data or loses provenance.
  preconditions:
  - QRNG output traverses drivers/services
  - Consumers cannot attest source and processing path
  potential_impacts:
  - confidentiality
  - integrity
  evidence_status: established-classical
  observables:
  - unexpected provider identifier
  - unsigned driver/config
  - fallback source not logged
  top10:
  - QST-03
  - QST-08
  mitigated_by:
  - QSC-04.003
  tested_by:
  - QSTEST-04.003
  references:
  - SRC-ETSI-QRNG
  - SRC-NIST-ENTROPY
  - SRC-CYCLONEDX-CBOM
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-04.004
  title: Randomness-derived key lifecycle and uniqueness failure
  domain: QSD-04
  tactics:
  - QTA-09
  description: Even adequate entropy is undermined by key derivation, reuse, storage, distribution, rotation or
    destruction defects.
  preconditions:
  - Keys/tokens are derived from QRNG/RBG
  - Lifecycle controls are fragmented
  potential_impacts:
  - confidentiality
  - integrity
  - privacy_ip
  evidence_status: established-classical
  observables:
  - duplicate key IDs
  - unexpected key reuse
  - excessive retention
  - unclear derivation context
  top10:
  - QST-08
  mitigated_by:
  - QSC-04.004
  tested_by:
  - QSTEST-04.004
  references:
  - SRC-NIST-ENTROPY
  - SRC-ETSI-QRNG
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-05.001
  title: Environmental perturbation degrades quantum operation
  domain: QSD-05
  tactics:
  - QTA-05
  - QTA-12
  description: Temperature, vibration, electromagnetic, optical, vacuum or other environmental conditions move hardware
    outside its validated operating envelope.
  preconditions:
  - Quantum hardware is environmentally sensitive
  - Monitoring or access control is incomplete
  potential_impacts:
  - integrity
  - availability
  - safety_mission
  evidence_status: documented-implementation-class
  observables:
  - correlated fidelity/measurement drift
  - environmental alarm
  - unexpected recalibration frequency
  top10:
  - QST-06
  mitigated_by:
  - QSC-05.001
  tested_by:
  - QSTEST-05.001
  references:
  - SRC-HW-PRIMER
  - SRC-ARGONNE-TAXONOMY
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-05.002
  title: Crosstalk or shared physical resource interference
  domain: QSD-05
  tactics:
  - QTA-07
  - QTA-08
  - QTA-12
  description: Co-located workloads or shared hardware effects influence another job, disclose workload characteristics
    or degrade result quality.
  preconditions:
  - Shared QPU or control resources
  - Scheduler permits co-location or temporal adjacency
  potential_impacts:
  - confidentiality
  - integrity
  - availability
  - privacy_ip
  evidence_status: demonstrated-lab
  observables:
  - tenant-correlated error shift
  - schedule-dependent fidelity
  - unexpected resource coupling
  top10:
  - QST-05
  - QST-06
  mitigated_by:
  - QSC-05.002
  tested_by:
  - QSTEST-05.002
  references:
  - SRC-HW-PRIMER
  - SRC-QATTCK
  notes: Applicability and exploitability must be established for the assessed system; this entry is not an incident
    claim.
- id: QTE-05.003
  title: Unauthorized access to QPU support infrastructure
  domain: QSD-05
  tactics:
  - QTA-03
  - QTA-04
  - QTA-05
  description: An actor reaches laboratory consoles, cryogenic/optical controls, maintenance ports or support systems
    beyond their approved role.
  preconditions:
  - Support infrastructure has network or physical access paths
  - Segmentation or privilege control is weak
  potential_impacts:
  - integrity
  - availability
  - safety_mission
  - privacy_ip
  evidence_status: established-classical
  observables:
  - shared admin credentials
  - flat laboratory network
  - unmonitored maintenance session
