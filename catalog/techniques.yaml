- id: QTE-05.004
  title: Quantum hardware IP leakage, tampering or provenance failure
  domain: QSD-05
  tactics:
  - QTA-02
  - QTA-08
  - QTA-11
  description: Design, component, fabrication, maintenance or diagnostic information is exposed or altered, or hardware
    identity cannot be verified.
  preconditions:
  - Multiple suppliers/maintainers
